	<!-- 
	About this page:

I know nothing about medieval times/language, but I've always found it super funny. I decided to make my newspaper themed after general "medieval fantasy", with a sort of comedic tone. I wanted it to look dated but simultaneously modern, with a yellow-ish "aged" background and purple, regal accents with the headers. I ultimately had to leave off certain images I included in the mockup, because I was unable to find royalty-free equivalents. I wasn't sure where to put attribution, so I included it as a comment at the end of all of my code. I think this design achieves the goal of being relatively medieval-themed, and featuring a consistent design that resembles a newspaper and functions... relatively okay on mobile (although I was unable to fully realize my vision).
	-->
